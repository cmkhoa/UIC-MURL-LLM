run:
  id: llama3.2-3b-murl-v0.8-v0.5
  seed: 20261004
  purpose: "v0.8 cross-family v0.5 arm: ordinary SFT on frozen moderated taxonomy-balanced data."

base_model:
  id: meta-llama/Llama-3.2-3B-Instruct
  revision: 0cb88a4f764b7a12671c53f0838cd831a0843b95
  load_in_4bit: true
  quantization: nf4
  compute_dtype: float16
  trust_remote_code: false

architecture:
  model_type: llama
  license_access: "Llama 3.2 Community License; manual-gated Hugging Face repository."
  projection_mapping: "Separate q_proj, k_proj, v_proj, o_proj attention and gate_proj, up_proj, down_proj MLP linears."

data:
  train_file: data/training/v0.5-sft-train.jsonl
  train_file_sha256: ea78f215770cf29880532e19126a9c27a28308bb1403c52152c7c995c1139826
  train_examples: 293
  validation_file: data/processed/validation.jsonl
  validation_file_sha256: 247a41683c61d80acbb4974c845a3f3f03fac2218f62f6da26ab3a091cb406ee
  test_policy: Do not read or use data/processed/test.jsonl during training or tuning.
  message_field: messages

qlora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  max_steps: 60
  learning_rate: 0.0002
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_sequence_length: 2048
  warmup_steps: 3
  logging_steps: 5
  save_steps: 60
  output_dir: models/llama3.2-3b-murl-v0.8-v0.5

evaluation:
  after_training: Compare adapter and untouched base with the v0.2 prompt on validation only.
  required_metrics: [structured_output_validity, correctness_accuracy, correctness_macro_f1, first_error_exact_match, first_error_distance, taxonomy_macro_f1]

adapter_inference:
  run_id: llama3.2-3b-murl-v0.8-v0.5-validation
  split: validation
  system_prompt_file: prompts/v0.2-sft-system.md
  max_new_tokens: 256

artifacts:
  save: [adapter, tokenizer, trainer_state, training_log, resolved_config, dataset_metadata, validation_outputs, evaluation_results]
