run:
  id: qwen2.5-3b-murl-v0.1-sft-smoke
  seed: 20261004
  purpose: Validate loss, checkpoint loading, and structured-output generation before a full adaptation.

base_model:
  id: Qwen/Qwen2.5-3B-Instruct
  revision: aa8e72537993ba99e69dfaafa59ed015b17504d1
  load_in_4bit: true
  quantization: nf4
  compute_dtype: float16

data:
  train_file: data/training/v0.1-sft-train.jsonl
  train_file_sha256: 16365760e906c0fe48c3c1d1b15ecb281e2c374bdacdf1f2cae60996edfa9aac
  train_examples: 155
  validation_file: data/processed/validation.jsonl
  validation_file_sha256: 247a41683c61d80acbb4974c845a3f3f03fac2218f62f6da26ab3a091cb406ee
  test_policy: Do not read or use data/processed/test.jsonl during training or tuning.
  message_field: messages

qlora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  max_steps: 10
  learning_rate: 0.0002
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_sequence_length: 2048
  warmup_steps: 1
  logging_steps: 1
  save_steps: 10
  output_dir: models/qwen2.5-3b-murl-v0.1-sft-smoke

evaluation:
  after_training: Run the adapter and untouched base model through evaluation/evaluate.py on validation only.
  required_metrics: [structured_output_validity, correctness_accuracy, correctness_macro_f1, first_error_exact_match, first_error_distance, taxonomy_macro_f1]

artifacts:
  save: [adapter, tokenizer, trainer_state, training_log, resolved_config, dataset_metadata, validation_outputs, evaluation_results]
